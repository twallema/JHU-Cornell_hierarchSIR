[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11"]
build-backend = "setuptools.build_meta"

[project]
name = "hierarchSIR"
version = "0.0"
description = "A multi-strain SIR seasonal influenza model"
authors = [{name = "Dr. Tijs W. Alleman", email = "twa27@cornell.edu"}]
license = {text = "CC-BY-NC-SA"}
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "matplotlib",
    "xarray>=2025.11.0",
    "numpy>=2.4",
    "pandas",
    "scipy",
    "openpyxl",
    "pytest",
    "pySODM>=0.2.9"
]

[project.optional-dependencies]
develop = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests", "tests.*"]
